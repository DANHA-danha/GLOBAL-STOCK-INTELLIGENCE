# 산업 지도: 경제 변화 → 영향받는 산업 → 관심 종목
# - effects.sign: up(유리해질 수 있음) / down(불리해질 수 있음)
# - effects.universe: config/universe.yaml 의 industry 이름. 여기에 적힌 산업의 관심 종목이 같이 보여요
# - detect: 지금 지표로 자동 판단할 수 있는 변화(rate_cut, rate_hike, krw_weak, krw_strong, oil_up, oil_down)
#   비어 있으면 화면에서 직접 판단해요
# 모든 연결은 "그럴 수 있다"는 일반적인 경로예요. 실제 주가는 기업 실적, 이미 반영된 기대, 다른 사건과 함께 움직여요.

drivers:
  - id: rate_cut
    name: 금리 인하
    group: 금리
    detect: rate_cut
    term: 기준금리
    summary: 중앙은행이 기준금리를 내려 돈 빌리기가 쉬워져요.
    caution: 경기가 나빠서 급히 내리는 인하라면 주식시장 전체가 같이 떨어지기도 해요.
    effects:
      - {industry: 성장주 (인터넷·소프트웨어·바이오), sign: up, universe: [인터넷, 소프트웨어, 바이오],
         why: 먼 미래의 이익을 지금 가치로 바꿀 때 쓰는 할인율이 낮아져서, 미래 기대가 큰 기업의 가치가 커져요.}
      - {industry: 2차전지·전기차, sign: up, universe: [2차전지, 전기차],
         why: 공장을 짓는 데 빚을 많이 쓰는 산업이라 이자 부담이 줄어요. 전기차 할부 금리도 내려가요.}
      - {industry: 건설·부동산, sign: up, universe: [],
         why: 주택담보대출 이자가 내려가 집을 사려는 수요가 늘 수 있어요.}
      - {industry: 은행, sign: down, universe: [금융],
         why: 대출이자와 예금이자의 차이(예대마진)가 줄어 이익이 감소할 수 있어요.}

  - id: rate_hike
    name: 금리 인상
    group: 금리
    detect: rate_hike
    term: 기준금리
    summary: 중앙은행이 기준금리를 올려 돈 빌리기가 비싸져요. 보통 물가를 잡으려고 해요.
    caution: 경기가 좋아서 올리는 경우엔 실적이 같이 좋아져 주가가 버티기도 해요.
    effects:
      - {industry: 은행·보험, sign: up, universe: [금융],
         why: 대출이자가 먼저 오르고 예금이자는 천천히 따라와 예대마진이 커질 수 있어요. 보험사는 채권 운용 수익이 늘어요.}
      - {industry: 성장주 (인터넷·소프트웨어·바이오), sign: down, universe: [인터넷, 소프트웨어, 바이오],
         why: 할인율이 높아져 미래 이익의 현재 가치가 줄어요.}
      - {industry: 빚이 많은 기업·건설, sign: down, universe: [2차전지],
         why: 이자 비용이 늘고 주택 수요가 줄 수 있어요.}

  - id: krw_weak
    name: 원화 약세 (환율 상승)
    group: 환율
    detect: krw_weak
    term: 환율
    summary: 1달러를 사는 데 원화가 더 많이 들어요. 원/달러 환율이 오른 상태예요.
    caution: 원화 약세는 외국인 투자자에게 환차손이라, 외국인이 한국 주식을 팔아 대형주가 눌리기도 해요.
    effects:
      - {industry: 수출 기업 (반도체·자동차·방산), sign: up, universe: [반도체, 자동차, 방산],
         why: 같은 달러를 벌어도 원화로 바꾸면 매출과 이익이 커져요.}
      - {industry: 항공·여행, sign: down, universe: [],
         why: 항공유와 비행기 리스료를 달러로 내서 비용이 늘고, 해외여행 수요가 줄어요.}
      - {industry: 원자재 수입 기업 (음식료 등), sign: down, universe: [],
         why: 원료를 달러로 사오는 비용이 올라요.}

  - id: krw_strong
    name: 원화 강세 (환율 하락)
    group: 환율
    detect: krw_strong
    term: 환율
    summary: 1달러를 사는 데 원화가 덜 들어요. 원/달러 환율이 내린 상태예요.
    caution: 원화가 강해지면 외국인 자금이 들어오기 쉬워 대형주에는 우호적일 수 있어요.
    effects:
      - {industry: 항공·여행, sign: up, universe: [],
         why: 달러로 내는 비용이 줄고 해외여행 수요가 늘어요.}
      - {industry: 원자재 수입 기업 (음식료 등), sign: up, universe: [],
         why: 원료 수입 비용이 줄어요.}
      - {industry: 수출 기업 (반도체·자동차·방산), sign: down, universe: [반도체, 자동차, 방산],
         why: 달러로 번 돈을 원화로 바꾸면 줄어들어요.}

  - id: oil_up
    name: 국제유가 상승
    group: 원자재
    detect: oil_up
    term: CPI
    summary: 원유 가격이 올라요. 물가를 밀어 올려 금리 인하를 어렵게 만들 수 있어요.
    caution: 수요가 좋아서 오르는 유가와, 전쟁처럼 공급이 막혀 오르는 유가는 시장 반응이 달라요.
    effects:
      - {industry: 정유·에너지, sign: up, universe: [],
         why: 원유와 석유제품 가격이 오르면 재고 가치와 정제 마진이 커질 수 있어요.}
      - {industry: 원전·신재생, sign: up, universe: [에너지·원전],
         why: 석유·가스 발전이 비싸지면 다른 에너지원을 찾는 투자가 늘어요.}
      - {industry: 항공·해운, sign: down, universe: [],
         why: 연료비가 비용에서 차지하는 비중이 커요.}
      - {industry: 화학, sign: down, universe: [],
         why: 원료(나프타) 가격이 올라 제품 마진이 줄 수 있어요.}

  - id: oil_down
    name: 국제유가 하락
    group: 원자재
    detect: oil_down
    term: CPI
    summary: 원유 가격이 내려요. 물가 부담이 줄어요.
    caution: 경기 둔화로 수요가 줄어서 내리는 경우엔 시장 전체에 나쁜 신호일 수 있어요.
    effects:
      - {industry: 항공·해운, sign: up, universe: [],
         why: 연료비가 줄어요.}
      - {industry: 화학, sign: up, universe: [],
         why: 원료 가격이 내려 마진이 좋아질 수 있어요.}
      - {industry: 정유·에너지, sign: down, universe: [],
         why: 재고 가치와 정제 마진이 줄 수 있어요.}

  - id: ai_capex
    name: AI 투자 확대
    group: 산업
    detect: ""
    term: 영업이익
    summary: 빅테크 기업들이 AI 데이터센터에 쓰는 돈을 늘려요.
    caution: 투자가 기대보다 줄거나, 투자 대비 수익이 안 나온다는 의심이 생기면 같은 경로로 반대 효과가 나요.
    effects:
      - {industry: 반도체 (특히 고성능 메모리), sign: up, universe: [반도체],
         why: AI 서버에는 GPU와 고대역폭 메모리(HBM)가 대량으로 들어가요.}
      - {industry: 전력기기, sign: up, universe: [전력기기],
         why: 데이터센터가 전기를 많이 써서 변압기·전력망 투자가 늘어요.}
      - {industry: 원전·발전, sign: up, universe: [에너지·원전],
         why: 늘어나는 전력 수요를 채울 발전소가 필요해요.}
      - {industry: 클라우드·소프트웨어, sign: up, universe: [소프트웨어],
         why: AI 서비스를 파는 클라우드 기업의 매출이 늘 수 있어요.}

  - id: china_recovery
    name: 중국 경기 회복
    group: 해외 경기
    detect: ""
    term: PMI
    summary: 중국의 소비와 생산이 살아나요. 한국 수출의 약 5분의 1이 중국으로 가요.
    caution: 중국 기업들이 같은 제품을 직접 만들면서, 예전만큼 한국 기업 혜택이 크지 않을 수 있어요.
    effects:
      - {industry: 화학·철강, sign: up, universe: [],
         why: 중국 공장과 건설 현장의 원자재 수요가 늘어요.}
      - {industry: 화장품·면세·여행, sign: up, universe: [],
         why: 중국 소비자와 관광객이 늘어요.}
      - {industry: 반도체, sign: up, universe: [반도체],
         why: 중국 스마트폰·PC 생산이 늘면 메모리 수요도 늘어요.}

  - id: us_tariff
    name: 미국 관세 인상
    group: 미국 정책
    detect: ""
    term: 환율
    summary: 미국이 수입품에 매기는 세금을 올려요.
    caution: 관세율, 대상 품목, 시작 시점, 예외 조항이 실제로 어떻게 정해지는지가 중요해요. 발표만으로 판단하면 안 돼요.
    effects:
      - {industry: 대미 수출 기업 (자동차·철강), sign: down, universe: [자동차],
         why: 미국에서 파는 가격이 올라 판매가 줄거나, 관세를 기업이 떠안아 이익이 줄어요.}
      - {industry: 미국 현지 생산 비중이 큰 기업, sign: up, universe: [],
         why: 관세를 피할 수 있어 경쟁사보다 유리해질 수 있어요.}

  - id: defense
    name: 각국 방위비 확대
    group: 정책
    detect: ""
    term: 영업이익
    summary: 유럽·중동·아시아 여러 나라가 국방 예산을 늘려요.
    caution: 계약부터 실제 매출까지 몇 년이 걸리고, 수주 소식이 이미 주가에 반영됐을 수 있어요.
    effects:
      - {industry: 방산, sign: up, universe: [방산],
         why: 자주포·전차·미사일 같은 무기 수출 계약이 늘어요.}

  - id: green_support
    name: 친환경 지원 확대
    group: 정책
    detect: ""
    term: 영업이익
    summary: 정부가 전기차·배터리·태양광에 보조금과 세금 혜택을 늘려요.
    caution: 정권이나 정책이 바뀌어 지원이 줄면 같은 경로로 반대 효과가 나요.
    effects:
      - {industry: 2차전지·전기차, sign: up, universe: [2차전지, 전기차],
         why: 전기차 가격이 내려가 판매가 늘고, 배터리 공장 투자에 세금 혜택이 생겨요.}
      - {industry: 태양광·풍력, sign: up, universe: [],
         why: 발전소 설치 비용 부담이 줄어요.}
