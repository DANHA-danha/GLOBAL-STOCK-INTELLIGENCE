# 출처를 확인한 날: 2026-11-09

types:
  미국 금리 결정:
    term: FOMC
    why: 미국 기준금리가 바뀌면 달러, 전 세계 금리, 성장주 주가가 함께 움직여요.
  한국 금리 결정:
    term: 금통위
    why: 한국 기준금리는 대출금리, 원화 가치, 은행·건설·성장주에 영향을 줘요.
  미국 지표:
    term: CPI
    why: 물가·고용·성장 숫자가 예상과 다르면 금리 전망이 바뀌어 시장이 크게 움직여요.

