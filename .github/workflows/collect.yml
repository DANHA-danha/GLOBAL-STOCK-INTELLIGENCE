# 매일 아침 경제 지표와 주가를 받아 data/ 를 갱신하고 커밋해요.
# 재무제표(DART)는 해외 서버에서 접속이 막혀서, 내 컴퓨터에서 가끔 직접 받아요:
#   python3 scripts/collect_stocks.py   (사업보고서가 나오는 4월쯤 한 번)
name: collect

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 07:17 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 직접 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 경제 지표
        run: python scripts/collect.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 주가
        run: python scripts/collect_stocks.py
        continue-on-error: true   # 주가 수집이 실패해도 경제 지표는 저장해요
      - name: commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 갱신"
          git push